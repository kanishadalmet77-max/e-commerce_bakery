<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Accounts</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-wrap { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
    th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid #eae3d8; font-size: 14px; }
    th { background: #7d8c76; color: white; font-size: 13px; }
    #searchBox { width: 100%; padding: 10px; margin-top: 20px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; font-size: 14px; box-sizing: border-box; }
    .count-line { margin-top: 10px; font-size: 13px; color: #5c5249; }
    a.back-link { font-size: 13px; }
  </style>
</head>
<body>
  <div class="admin-wrap">
    <a class="back-link" href="index.html">&larr; Back to site</a>

    <div class="form-header"><h2>ALL ACCOUNTS</h2></div>

    <input type="text" id="searchBox" placeholder="Search by name or email..." oninput="renderUsers()">
    <div class="count-line" id="countLine"></div>

    <table>
      <thead>
        <tr><th>Name</th><th>Email</th><th>Signed Up</th></tr>
      </thead>
      <tbody id="userTableBody"></tbody>
    </table>
  </div>

  <script>
    // Reads the exact same "users" list that signup.html writes to.
    function getUsers() {
      const stored = localStorage.getItem("users");
      return stored ? JSON.parse(stored) : [];
    }

    // Turns the saved ISO timestamp into a readable date/time.
    // Accounts created before this feature was added won't have a
    // timestamp, so those show "Not recorded" instead of breaking.
    function formatTime(isoString) {
      if (!isoString) return "Not recorded";
      const d = new Date(isoString);
      return d.toLocaleString();
    }

    function renderUsers() {
      const search = document.getElementById("searchBox").value.trim().toLowerCase();
      const users = getUsers();

      const filtered = users.filter(function (u) {
        return u.fullName.toLowerCase().includes(search) || u.email.toLowerCase().includes(search);
      });

      const tbody = document.getElementById("userTableBody");
      tbody.innerHTML = "";

      if (filtered.length === 0) {
        tbody.innerHTML = "<tr><td colspan='3'>No matching accounts.</td></tr>";
      } else {
        filtered.forEach(function (u) {
          const row = document.createElement("tr");
          row.innerHTML =
            "<td>" + u.fullName + "</td>" +
            "<td>" + u.email + "</td>" +
            "<td>" + formatTime(u.signupTime) + "</td>";
          tbody.appendChild(row);
        });
      }

      document.getElementById("countLine").textContent =
        filtered.length + " of " + users.length + " total accounts shown";
    }

    document.addEventListener("DOMContentLoaded", renderUsers);
  </script>
</body>
</html>
