<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    

<div class="auth-containers">
    <div class="form-header">
        <h2>Welcome Back</h2><br><br>
        <p>Log in to access your account</p><br>
    </div>

    <form id="loginForm">
        <div class="field">
            <label for="loginEmail">Email Address</label>
            <input id="loginEmail" type="text" placeholder="name@example.com">
            <p id="loginEmailError" class="error"></p><br>
        </div>
        <div class="field">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" type="password" placeholder="••••••••">
            <p id="loginPasswordError" class="error"></p><br>
        </div>
        <button type="submit" class="submit-btn">Log In</button>
    </form>

    <p id="result" class="status-message"></p><br>

    <div class="form-footer">
        Don't have an account? <a href="signup.html">Sign Up</a>
    </div>
</div>

<script>
const loginForm = document.getElementById("loginForm");
const loginEmailInput = document.getElementById("loginEmail");
const loginPassInput = document.getElementById("loginPassword");

const loginEmailError = document.getElementById("loginEmailError");
const loginPassError = document.getElementById("loginPasswordError");
const result = document.getElementById("result");

function showError(el, message) { el.innerText = message; }
function clearError(el) { el.innerText = ""; }

function validateEmail() {
    let value = loginEmailInput.value.trim();
    if (!(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value))) {
        showError(loginEmailError, "Enter a valid email address.");
        return false;
    }
    clearError(loginEmailError);
    return true;
}

function validatePassword() {
    let value = loginPassInput.value;
    if (value.length === 0) {
        showError(loginPassError, "Please enter your password.");
        return false;
    }
    clearError(loginPassError);
    return true;
}

// ---- Real authentication logic (this was missing before) ----
// Reads the accounts that signup.html created, stored under "users"
function getUsers() {
    const stored = localStorage.getItem("users");
    return stored ? JSON.parse(stored) : [];
}

loginForm.addEventListener("submit", function (event) {
    event.preventDefault();
    result.innerText = "";

    let okEmail = validateEmail();
    let okPass = validatePassword();

    if (okEmail && okPass) {
        const email = loginEmailInput.value.trim();
        const password = loginPassInput.value;
        const users = getUsers();

        // Look for a signed-up account matching this exact email + password
        const match = users.find(function (u) {
            return u.email === email && u.password === password;
        });

        if (match) {
            // Record who's currently logged in, so index.html and
            // other pages can check this later if needed.
            localStorage.setItem("currentUser", JSON.stringify({ fullName: match.fullName, email: match.email }));

            result.innerText = "Log In Successful! Redirecting...";
            result.className = "status-message ok";

            // Short pause so the success message is actually visible
            // before the page navigates away.
            setTimeout(function () {
                window.location.href = "index.html";
            }, 800);
        } else {
            result.innerText = "Invalid email or password.";
            result.className = "status-message error-text";
        }
    } else {
        result.innerText = "Please fix the errors above.";
        result.className = "status-message error-text";
    }
});
</script>

</body>
</html>
