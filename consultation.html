<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Consultation - Delicious Cakes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="top-banner">
    OPEN TODAY: 8AM - 9PM • Main St, Bhayandar
  </div>

  <header class="main-header">
    <div class="logo-area">
      <div class="logo-circle">
        <img src="https://i.postimg.cc/d0Gcq2Gg/cropped-circle-image.png" alt="Bakery Logo">
      </div>
    </div>

    <nav class="nav-links">
      <a href="index.html#shop-all">SHOP ALL</a>
      <a href="index.html#daily-treats">DAILY TREATS</a>
      <a href="index.html#weddings">WEDDINGS</a>
      <a href="index.html#about">ABOUT</a>
      <a href="index.html#contact us">CONTACT US</a>
    </nav>

    <div class="header-actions">
      <div class="icon-badge-container">
        <a href="cart.html"> <i class="fa-solid fa-shopping-bag action-icon"></i> <span id="cartCount">0</span></a>
      </div>
      <div class="profile-menu-container">
        <a href="signup.html"><i class="fa-regular fa-user action-icon"></i></a>
      </div>
    </div>
  </header>

<div class="auth-containers">
    <div class="form-header"><h2>BOOK A CONSULTATION</h2></div>

    <form id="consultationForm">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" required>
      </div>
      <div class="field">
        <label for="prefDate">Preferred Date</label>
        <input type="date" id="prefDate" required>
      </div>
      <div class="field">
        <label for="message">Tell us about your event</label>
        <textarea id="message" rows="4"></textarea>
      </div>
      <button type="submit" class="submit-btn">Submit Request</button>
    </form>
</div>

<script src="products.js"></script>
<script src="auth.js"></script>
<script src="cart.js"></script>
<script>
    function bookConsultation(name, email, phone, preferredDate, message) {
      const stored = localStorage.getItem("consultations");
      const consultations = stored ? JSON.parse(stored) : [];
      consultations.push({ name, email, phone, preferredDate, message, timestamp: new Date().toISOString() });
      localStorage.setItem("consultations", JSON.stringify(consultations));
      alert("Consultation booked successfully! We'll be in touch, " + name + ".");
      window.location.href = "index.html";
    }

    document.getElementById("consultationForm").addEventListener("submit", function(e) {
      e.preventDefault();
      bookConsultation(
        document.getElementById("name").value,
        document.getElementById("email").value,
        document.getElementById("phone").value,
        document.getElementById("prefDate").value,
        document.getElementById("message").value
      );
    });
</script>
</body>
</html>
