<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Delicious Cakes</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-wrap { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; background: white; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eae3d8; font-size: 13px; }
    th { background: #7d8c76; color: white; font-size: 12px; }
    .search-box { width: 100%; padding: 9px; margin-top: 16px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; font-size: 13px; box-sizing: border-box; }
    .count-line { margin-top: 8px; font-size: 12px; color: #5c5249; }
    .admin-section { margin-bottom: 50px; }
    .status-paid { color: #4a7a4a; font-weight: 600; }
    .status-pending { color: #a65b5b; font-weight: 600; }
    a.back-link { font-size: 13px; }
  </style>
</head>
<body>
  <div class="admin-wrap">
    <a class="back-link" href="index.html">&larr; Back to site</a>
    <div class="form-header"><h2>ADMIN — SITE DATA</h2></div>

    <!-- ACCOUNTS -->
    <div class="admin-section">
      <h3>Accounts</h3>
      <input type="text" class="search-box" id="usersSearch" placeholder="Search by name or email..." oninput="renderUsers()">
      <div class="count-line" id="usersCount"></div>
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Signed Up</th></tr></thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>

    <!-- ORDERS -->
    <div class="admin-section">
      <h3>Orders</h3>
      <input type="text" class="search-box" id="ordersSearch" placeholder="Search by customer name or email..." oninput="renderOrders()">
      <div class="count-line" id="ordersCount"></div>
      <table>
        <thead><tr><th>Customer</th><th>Items</th><th>Total</th><th>Payment Method</th><th>Status</th><th>Date</th></tr></thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>

    <!-- CONSULTATIONS -->
    <div class="admin-section">
      <h3>Consultation Requests</h3>
      <input type="text" class="search-box" id="consultSearch" placeholder="Search by name or email..." oninput="renderConsultations()">
      <div class="count-line" id="consultCount"></div>
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Preferred Date</th><th>Message</th><th>Submitted</th></tr></thead>
        <tbody id="consultBody"></tbody>
      </table>
    </div>

    <!-- CONTACT MESSAGES -->
    <div class="admin-section">
      <h3>Contact Us Messages</h3>
      <input type="text" class="search-box" id="contactSearch" placeholder="Search by name or email..." oninput="renderContactMessages()">
      <div class="count-line" id="contactCount"></div>
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Message</th><th>Sent</th></tr></thead>
        <tbody id="contactBody"></tbody>
      </table>
    </div>

  </div>

  <script src="products.js"></script>
  <script>
    // ---- Shared helpers ----
    function getData(key) {
      const stored = localStorage.getItem(key);
      return stored ? JSON.parse(stored) : [];
    }

    function formatTime(isoString) {
      if (!isoString) return "Not recorded";
      return new Date(isoString).toLocaleString();
    }

    // ---- ACCOUNTS ----
    function renderUsers() {
      const search = document.getElementById("usersSearch").value.trim().toLowerCase();
      const users = getData("users");
      const filtered = users.filter(function (u) {
        return u.fullName.toLowerCase().includes(search) || u.email.toLowerCase().includes(search);
      });

      const body = document.getElementById("usersBody");
      body.innerHTML = "";
      if (filtered.length === 0) {
        body.innerHTML = "<tr><td colspan='3'>No matching accounts.</td></tr>";
      } else {
        filtered.forEach(function (u) {
          const row = document.createElement("tr");
          row.innerHTML = "<td>" + u.fullName + "</td><td>" + u.email + "</td><td>" + formatTime(u.signupTime) + "</td>";
          body.appendChild(row);
        });
      }
      document.getElementById("usersCount").textContent = filtered.length + " of " + users.length + " accounts shown";
    }

    // ---- ORDERS ----
    function renderOrders() {
      const search = document.getElementById("ordersSearch").value.trim().toLowerCase();
      const orders = getData("orders");
      const filtered = orders.filter(function (o) {
        return (o.customerName || "").toLowerCase().includes(search) || (o.customerEmail || "").toLowerCase().includes(search);
      });

      const body = document.getElementById("ordersBody");
      body.innerHTML = "";
      if (filtered.length === 0) {
        body.innerHTML = "<tr><td colspan='6'>No matching orders.</td></tr>";
      } else {
        // Newest orders first
        filtered.slice().reverse().forEach(function (o) {
          const itemsText = o.items.map(function (item) {
            const p = getProductById(item.productId);
            return (p ? p.name : "Unknown") + " x" + item.quantity;
          }).join(", ");

          const statusClass = o.status === "Paid" ? "status-paid" : "status-pending";

          const row = document.createElement("tr");
          row.innerHTML =
            "<td>" + (o.customerName || "Guest") + "<br><span style='color:#888; font-size:11px;'>" + (o.customerEmail || "") + "</span></td>" +
            "<td>" + itemsText + "</td>" +
            "<td>\u20B9" + o.total + "</td>" +
            "<td>" + o.paymentMethod + "</td>" +
            "<td class='" + statusClass + "'>" + o.status + "</td>" +
            "<td>" + formatTime(o.date) + "</td>";
          body.appendChild(row);
        });
      }
      document.getElementById("ordersCount").textContent = filtered.length + " of " + orders.length + " orders shown";
    }

    // ---- CONSULTATIONS ----
    function renderConsultations() {
      const search = document.getElementById("consultSearch").value.trim().toLowerCase();
      const consultations = getData("consultations");
      const filtered = consultations.filter(function (c) {
        return (c.name || "").toLowerCase().includes(search) || (c.email || "").toLowerCase().includes(search);
      });

      const body = document.getElementById("consultBody");
      body.innerHTML = "";
      if (filtered.length === 0) {
        body.innerHTML = "<tr><td colspan='6'>No matching consultation requests.</td></tr>";
      } else {
        filtered.slice().reverse().forEach(function (c) {
          const row = document.createElement("tr");
          row.innerHTML =
            "<td>" + c.name + "</td><td>" + c.email + "</td><td>" + (c.phone || "") + "</td>" +
            "<td>" + (c.preferredDate || "") + "</td><td>" + (c.message || "") + "</td>" +
            "<td>" + formatTime(c.timestamp) + "</td>";
          body.appendChild(row);
        });
      }
      document.getElementById("consultCount").textContent = filtered.length + " of " + consultations.length + " requests shown";
    }

    // ---- CONTACT MESSAGES ----
    function renderContactMessages() {
      const search = document.getElementById("contactSearch").value.trim().toLowerCase();
      const messages = getData("contactMessages");
      const filtered = messages.filter(function (m) {
        return (m.name || "").toLowerCase().includes(search) || (m.email || "").toLowerCase().includes(search);
      });

      const body = document.getElementById("contactBody");
      body.innerHTML = "";
      if (filtered.length === 0) {
        body.innerHTML = "<tr><td colspan='4'>No matching messages.</td></tr>";
      } else {
        filtered.slice().reverse().forEach(function (m) {
          const row = document.createElement("tr");
          row.innerHTML =
            "<td>" + m.name + "</td><td>" + m.email + "</td><td>" + m.message + "</td><td>" + formatTime(m.timestamp) + "</td>";
          body.appendChild(row);
        });
      }
      document.getElementById("contactCount").textContent = filtered.length + " of " + messages.length + " messages shown";
    }

    document.addEventListener("DOMContentLoaded", function () {
      renderUsers();
      renderOrders();
      renderConsultations();
      renderContactMessages();
    });
  </script>
</body>
</html>
