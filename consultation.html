<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Consultation</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Plus Jakarta Sans',sans-serif; background:#fffdf9; color:#2c2520; padding:40px; }
    .auth-containers { background:#fffdf9; border:1px solid #eae3d8; padding:48px; border-radius:12px; max-width:500px; margin:0 auto; }
    .form-header h2 { background:#7d8c76; color:white; text-align:center; padding:10px; font-size:13px; font-weight:600; letter-spacing:1px; margin-bottom:20px; }

    input, textarea { width:100%; padding:8px; margin-top:5px; margin-bottom:15px; border:1px solid #ccc; border-radius:6px; }
    .submit-btn { background:#7d8c76; color:white; border:none; padding:10px 16px; border-radius:12px; font-size:15px; font-weight:600; cursor:pointer; width:100%; }
  </style>
</head>
<body>
  <div class="auth-containers">
    <div class="form-header"><h2>BOOK A CONSULTATION</h2></div>
    <form id="consultationForm">
      <label>Name:</label><br>
      <input type="text" id="name" required><br>
      <label>Email:</label><br>
      <input type="email" id="email" required><br>
      <label>Phone:</label><br>
      <input type="tel" id="phone" required><br>
      <label>Preferred Date:</label><br>
      <input type="date" id="prefDate" required><br>
      <label>Message:</label><br>
      <textarea id="message" rows="4"></textarea><br><br>
      <button type="submit" class="submit-btn">submit</button>
      
    </form>
  </div>

  <script>
    // consultation.js logic
    function bookConsultation(name, email, phone, preferredDate, message) {
      const stored = localStorage.getItem("consultations");
      const consultations = stored ? JSON.parse(stored) : [];
      consultations.push({ name, email, phone, preferredDate, message, timestamp: new Date() });
      localStorage.setItem("consultations", JSON.stringify(consultations));
      alert("Consultation booked successfully!");
    }

    document.getElementById("consultationForm").addEventListener("submit", function(e) {
      e.preventDefault();
      bookConsultation(
        document.getElementById("name").value,
        document.getElementById("email").value,
        document.getElementById("phone").value,
        document.getElementById("prefDate").value,
        document.getElementById("message").value
      );
    });
  </script>
</body>
</html>
